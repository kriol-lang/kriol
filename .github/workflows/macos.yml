name: macOS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE: kriol-macos-arm64

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install dependencies
        run: brew install llvm@20 flex bison cmake zstd coreutils

      - name: Add LLVM 20, bison and flex to PATH
        run: |
          echo "$(brew --prefix llvm@20)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Build and test
        run: |
          cmake -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DKRIOL_ENABLE_WASM=OFF \
            -DCMAKE_INSTALL_BINDIR=. \
            -DCMAKE_INSTALL_DOCDIR=.

          cmake --build build/release --target check

      - name: Stage artifact
        run: cmake --install build/release --prefix "$STAGE"

      # The archive must run on a Mac without Homebrew.
      - name: Check for Homebrew dylibs
        run: |
          otool -L "$STAGE/kriol"
          if otool -L "$STAGE/kriol" | grep -q "$(brew --prefix)"; then
            echo "kriol links against Homebrew libraries" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kriol-macos-arm64
          path: ${{ env.STAGE }}
