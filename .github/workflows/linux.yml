name: Linux

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE: kriol-linux-x86_64

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends flex bison \
            clang-20 llvm-20 llvm-20-dev llvm-20-tools lld-20 cmake \
            zlib1g-dev libzstd-dev wasi-libc libclang-rt-20-dev-wasm32

      - name: Add LLVM 20 to PATH
        run: echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Build and test
        run: |
          cmake -B build/release \
            -DCMAKE_BUILD_TYPE=Release \
            -DKRIOL_STATIC=ON \
            -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_INSTALL_BINDIR=. \
            -DCMAKE_INSTALL_DOCDIR=.

          cmake --build build/release --target check

      - name: Stage artifact
        run: cmake --install build/release --prefix "$STAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kriol-linux-x86_64
          path: ${{ env.STAGE }}
