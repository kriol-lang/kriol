name: Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'windows-*'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 20.1.8
  LLVM_ROOT: C:\llvm\clang+llvm-20.1.8-x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc

      - name: Download LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          curl.exe -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$archive"
          7z x llvm.tar.xz -so | 7z x -si -ttar -oC:\llvm -y | Out-Null
          Remove-Item llvm.tar.xz

      - name: Install build tools
        shell: pwsh
        run: |
          choco install winflexbison3 ninja --no-progress -y
          Add-Content $env:GITHUB_PATH "$env:LLVM_ROOT\bin"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR="$env:LLVM_ROOT\lib\cmake\llvm" `
            -DCMAKE_C_COMPILER="$env:LLVM_ROOT\bin\clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="$env:LLVM_ROOT\bin\clang-cl.exe" `
            -DCLANG_PROGRAM="$env:LLVM_ROOT\bin\clang.exe"

      - name: Build
        run: cmake --build build --target kriol

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          dumpbin /nologo /dependents build\kriol.exe
          build\kriol.exe --version
          build\kriol.exe --help

          # Checked out with CRLF line endings on Windows runners.
          build\kriol.exe examples\hello_world.kriol --emit-ir -o hello.ll
          Get-Content hello.ll -TotalCount 5

          # Non-ASCII paths must survive the command line and file APIs.
          $utf8Path = Join-Path $env:RUNNER_TEMP 'olá mundu.kriol'
          Copy-Item examples\hello_world.kriol $utf8Path
          build\kriol.exe $utf8Path --emit-ir | Select-Object -First 3

      # Native .exe output still goes through the host clang and MSVC linker;
      # it is expected to need more work, so it does not fail the job yet.
      - name: Native output (experimental)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          build\kriol.exe examples\hello_world.kriol -o hello
          .\hello.exe

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "kriol-windows-x86_64"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item build\kriol.exe, LICENSE, README.md $stage

      - uses: actions/upload-artifact@v4
        with:
          name: kriol-windows-x86_64
          path: kriol-windows-x86_64
