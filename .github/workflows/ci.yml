name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            flex bison clang-20 llvm-20 llvm-20-dev llvm-20-tools lld-20 \
            cmake zlib1g-dev libzstd-dev wasi-libc libclang-rt-20-dev-wasm32

      - name: Add LLVM 20 to PATH
        run: echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Run tests
        run: |
          cmake -B build
          cmake --build build --target check
