name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    uses: ./.github/workflows/windows.yml

  macos:
    uses: ./.github/workflows/macos.yml

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    env:
      LINUX: kriol-${{ github.ref_name }}-linux-x86_64
      WINDOWS: kriol-${{ github.ref_name }}-windows-x86_64
      MACOS: kriol-${{ github.ref_name }}-macos-arm64

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kriol-linux-x86_64
          path: ${{ env.LINUX }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kriol-windows-x86_64
          path: ${{ env.WINDOWS }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kriol-macos-arm64
          path: ${{ env.MACOS }}

      - name: Pack archives
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x "$LINUX/kriol" "$MACOS/kriol"
          tar -czf "$LINUX.tar.gz" "$LINUX"
          tar -cJf "$LINUX.tar.xz" "$LINUX"
          tar -czf "$MACOS.tar.gz" "$MACOS"
          zip -r -9 "$WINDOWS.zip" "$WINDOWS"

      - name: Generate checksums
        run: |
          sha256sum *.tar.gz *.tar.xz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: |
            ${{ env.LINUX }}.tar.gz
            ${{ env.LINUX }}.tar.xz
            ${{ env.WINDOWS }}.zip
            ${{ env.MACOS }}.tar.gz
            SHA256SUMS.txt
