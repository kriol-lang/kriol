name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  windows:
    uses: ./.github/workflows/windows.yml

  release:
    needs: [linux, windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    env:
      LINUX: kriol-${{ github.ref_name }}-linux-x86_64
      WINDOWS: kriol-${{ github.ref_name }}-windows-x86_64

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: kriol-linux-x86_64
          path: ${{ env.LINUX }}

      - uses: actions/download-artifact@v7
        with:
          name: kriol-windows-x86_64
          path: ${{ env.WINDOWS }}

      - name: Pack archives
        run: |
          # Artifacts do not keep the executable bit.
          chmod +x "$LINUX/kriol"
          tar -czf "$LINUX.tar.gz" "$LINUX"
          tar -cJf "$LINUX.tar.xz" "$LINUX"
          zip -r -9 "$WINDOWS.zip" "$WINDOWS"

      - name: Generate checksums
        run: |
          sha256sum *.tar.gz *.tar.xz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: |
            ${{ env.LINUX }}.tar.gz
            ${{ env.LINUX }}.tar.xz
            ${{ env.WINDOWS }}.zip
            SHA256SUMS.txt
